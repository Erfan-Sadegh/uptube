[project]
name = "uptube-backend"
version = "0.1.0"
description = "Aparat to YouTube upload MVP with Metis Whisper subtitles"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42.0.0",
  "fastapi>=0.115.0",
  "google-api-python-client>=2.130.0",
  "httpx>=0.27.0",
  "imageio-ffmpeg>=0.5.1",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-dotenv>=1.0.0",
  "python-multipart>=0.0.9",
  "redis>=5.0.0",
  "rq>=1.16.0",
  "sqlalchemy>=2.0.0",
  "uvicorn>=0.30.0",
  "yt-dlp>=2025.1.0"
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"
